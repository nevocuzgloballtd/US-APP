<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Us</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E8A33D">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  body {
    background: #1F1522; color: #F5EFE6; font-family: -apple-system, sans-serif;
    margin: 0; padding: 20px 20px 60px; display: flex; flex-direction: column; align-items: center;
  }
  .num { font-size: 48px; color: #E8A33D; text-align: center; }
  .sub { text-align: center; color: #8A7690; font-size: 13px; margin-bottom: 20px; }
  .card { background: #2C1E30; border-radius: 16px; padding: 16px; width: 100%; max-width: 340px; margin-bottom: 16px; }
  .tz-row { display: flex; justify-content: space-around; text-align: center; }
  .tz-row div span { display: block; }
  .tz-place { color: #8A7690; font-size: 11px; }
  .tz-time { font-size: 18px; }
  .mood-row { display: flex; justify-content: space-between; margin-top: 10px; }
  .mood-btn { background: none; border: none; font-size: 22px; cursor: pointer; opacity: 0.6; }
  .mood-btn.active { opacity: 1; transform: scale(1.2); }
  #status { text-align: center; color: #8A7690; font-size: 12px; margin-top: 10px; }
  .wish-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid rgba(245,239,230,0.1); }
  .wish-input-row { display:flex; gap:8px; margin-top:10px; }
  .wish-input-row input, .compose-row input {
    flex:1; background:#1F1522; border:1px solid #8A7690; border-radius:8px; padding:8px; color:#F5EFE6;
  }
  .wish-input-row button, .compose-row button, .hug-btn, .who-btn, .sketch-btn, .game-btn {
    background:#E8A33D; border:none; border-radius:8px; padding:8px 14px; color:#2C1E30; font-weight:600; cursor:pointer;
  }
  .who-bar { display:flex; gap:8px; margin-bottom:16px; }
  .who-btn.inactive { background:#2C1E30; color:#8A7690; }
  .hug-btn { width:100%; background:#F2B8C6; color:#3A1F26; font-size:14px; padding:12px; }
  .chat-box { display:flex; flex-direction:column; max-height:260px; overflow-y:auto; margin-bottom:10px; }
  .bubble { max-width:75%; padding:8px 12px; border-radius:14px; font-size:13px; margin-bottom:6px; }
  .bubble.me { align-self:flex-end; background:#E8A33D; color:#2C1E30; }
  .bubble.them { align-self:flex-start; background:#1F1522; }
  .bubble img { display:block; max-width:160px; border-radius:8px; }
  .compose-row { display:flex; gap:8px; }
  .sketch-modal {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:50;
    flex-direction:column; align-items:center; justify-content:center; padding:20px;
  }
  .sketch-modal.open { display:flex; }
  #sketchCanvas { background:#F5EFE6; border-radius:12px; touch-action:none; }
  .sketch-controls { display:flex; gap:10px; margin-top:14px; }
  .sketch-controls button { padding:10px 16px; border:none; border-radius:8px; font-weight:600; cursor:pointer; }
  .ttt-cell {
    background:#1F1522; border:1px solid #8A7690; border-radius:8px;
    height:60px; display:flex; align-items:center; justify-content:center;
    font-size:28px; cursor:pointer; color:#F5EFE6;
  }
  .game-tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .game-tab { background:#1F1522; color:#8A7690; border:none; border-radius:8px; padding:6px 10px; font-size:11px; cursor:pointer; }
  .game-tab.active { background:#E8A33D; color:#2C1E30; font-weight:600; }
  .game-panel { display:none; }
  .game-panel.active { display:block; }
  .big-btn { width:100%; padding:16px; font-size:16px; border-radius:12px; border:none; background:#E8A33D; color:#2C1E30; font-weight:700; cursor:pointer; }
  .this-or-that-row { display:flex; gap:10px; }
  .this-or-that-row button { flex:1; padding:14px; border-radius:10px; border:none; background:#1F1522; color:#F5EFE6; font-size:14px; cursor:pointer; }
  .this-or-that-row button.picked { background:#E8A33D; color:#2C1E30; }
  .box-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .box-cell { background:#1F1522; border-radius:10px; padding:16px 0; text-align:center; font-size:22px; cursor:pointer; }
  .box-cell.opened { opacity:0.4; cursor:default; }
</style>
</head>
<body>

<div class="who-bar">
  <button class="who-btn" id="whoIsreal">I'm Isreal</button>
  <button class="who-btn inactive" id="whoFavour">I'm Favour</button>
</div>

<div class="num" id="dayCount">--</div>
<div class="sub">days together</div>

<div class="card">
  <div class="tz-row">
    <div><span class="tz-place">You</span><span class="tz-time" id="timeLagos">--:--</span></div>
    <div><span class="tz-place">Partner</span><span class="tz-time" id="timeHer">--:--</span></div>
  </div>
</div>

<div class="card">
  <div style="color:#8A7690; font-size:12px;">how are you feeling right now?</div>
  <div id="partnerMood" style="color:#F2B8C6; font-size:12px; margin-top:6px;"></div>
  <div class="mood-row">
    <button class="mood-btn" data-mood="sad">😔</button>
    <button class="mood-btn" data-mood="neutral">😐</button>
    <button class="mood-btn" data-mood="happy">🙂</button>
    <button class="mood-btn" data-mood="loved">😍</button>
    <button class="mood-btn" data-mood="tired">😴</button>
  </div>
</div>

<div class="card">
  <button class="hug-btn" id="hugBtn">🤗 send a hug</button>
</div>

<div class="card">
  <div style="color:#8A7690; font-size:12px; margin-bottom:10px;">notes</div>
  <div id="chatBox" class="chat-box"></div>
  <div class="compose-row">
    <button class="sketch-btn" id="openSketchBtn">✎</button>
    <input id="chatInput" type="text" placeholder="write something...">
    <button id="sendChatBtn">send</button>
  </div>
</div>

<div class="card">
  <div style="color:#8A7690; font-size:12px; margin-bottom:10px;">things to do when we meet</div>
  <div id="wishlist"></div>
  <div class="wish-input-row">
    <input id="newWishInput" type="text" placeholder="add something...">
    <button id="addWishBtn">add</button>
  </div>
</div>

<!-- PLAY TOGETHER -->
<div class="card">
  <div style="color:#8A7690; font-size:12px; margin-bottom:10px;">🎮 play together</div>
  <div class="game-tabs">
    <button class="game-tab active" data-game="ttt">❌⭕ Tic-Tac-Toe</button>
    <button class="game-tab" data-game="tap">🎯 Tap Race</button>
    <button class="game-tab" data-game="draw">💥 Quick Draw</button>
    <button class="game-tab" data-game="tot">❤️ This or That</button>
    <button class="game-tab" data-game="box">🎁 Mystery Box</button>
  </div>

  <!-- Tic Tac Toe -->
  <div class="game-panel active" id="panel-ttt">
    <div id="tttStatus" style="color:#F2B8C6; font-size:12px; margin-bottom:10px;"></div>
    <div id="tttBoard" style="display:grid; grid-template-columns:repeat(3,1fr); gap:6px; max-width:200px; margin:0 auto;"></div>
    <button id="tttResetBtn" style="margin-top:12px; width:100%;">reset game</button>
  </div>

  <!-- Tap Race -->
  <div class="game-panel" id="panel-tap">
    <div id="tapStatus" style="color:#F2B8C6; font-size:12px; margin-bottom:10px; text-align:center;">tap 20 times first to win!</div>
    <div style="display:flex; justify-content:space-around; margin-bottom:14px; font-size:14px;">
      <div>You: <span id="myTaps">0</span></div>
      <div>Partner: <span id="partnerTaps">0</span></div>
    </div>
    <button class="big-btn" id="tapBtn">TAP!</button>
    <button id="tapResetBtn" style="margin-top:10px; width:100%;">reset</button>
  </div>

  <!-- Quick Draw -->
  <div class="game-panel" id="panel-draw">
    <div id="drawStatus" style="text-align:center; font-size:16px; margin-bottom:14px;">tap start to begin</div>
    <button class="big-btn" id="drawBtn">START</button>
  </div>

  <!-- This or That -->
  <div class="game-panel" id="panel-tot">
    <div id="totQuestion" style="text-align:center; margin-bottom:12px; font-size:14px; color:#8A7690;"></div>
    <div class="this-or-that-row" id="totRow"></div>
    <div id="totResult" style="text-align:center; margin-top:12px; font-size:13px; color:#F2B8C6;"></div>
    <button id="totNextBtn" style="margin-top:10px; width:100%;">next question</button>
  </div>

  <!-- Mystery Box -->
  <div class="game-panel" id="panel-box">
    <div id="boxGrid" class="box-grid"></div>
    <div id="boxResult" style="text-align:center; margin-top:12px; font-size:13px; color:#F2B8C6;"></div>
  </div>
</div>

<div id="status"></div>

<!-- Sketch modal -->
<div class="sketch-modal" id="sketchModal">
  <canvas id="sketchCanvas" width="280" height="360"></canvas>
  <div class="sketch-controls">
    <button id="clearSketchBtn" style="background:#8A7690; color:#fff;">clear</button>
    <button id="cancelSketchBtn" style="background:#2C1E30; color:#F5EFE6;">cancel</button>
    <button id="sendSketchBtn" style="background:#E8A33D; color:#2C1E30;">send</button>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://oewhhcleehkhjjyliivb.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ld2hoY2xlZWhraGpqeWxpaXZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MTUwOTIsImV4cCI6MjEwNDE5MTA5Mn0.3IYP_WYYniWFdwwfq9dWJHMLCDUicsnTONUn_uOCgpg";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let CURRENT_USER = localStorage.getItem("us_app_user") || "isreal";
  function setUser(user) {
    CURRENT_USER = user;
    localStorage.setItem("us_app_user", user);
    document.getElementById("whoIsreal").classList.toggle("inactive", user !== "isreal");
    document.getElementById("whoFavour").classList.toggle("inactive", user !== "favour");
    loadChat();
    loadPartnerMood();
  }
  document.getElementById("whoIsreal").addEventListener("click", () => setUser("isreal"));
  document.getElementById("whoFavour").addEventListener("click", () => setUser("favour"));

  async function loadDayCount() {
    const { data, error } = await sb.from("couple_info").select("start_date").limit(1).single();
    if (error || !data) return;
    const start = new Date(data.start_date);
    document.getElementById("dayCount").textContent = Math.floor((new Date() - start) / 86400000);
  }

  function updateClocks() {
    const t = new Date().toLocaleTimeString("en-US", { timeZone: "Africa/Lagos", hour: "2-digit", minute: "2-digit" });
    document.getElementById("timeLagos").textContent = t;
    document.getElementById("timeHer").textContent = t;
  }

  document.querySelectorAll(".mood-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      document.querySelectorAll(".mood-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      await sb.from("mood_entries").insert({ sender: CURRENT_USER, mood: btn.dataset.mood });
      document.getElementById("status").textContent = "Mood saved ✓";
    });
  });

  async function loadPartnerMood() {
    const { data, error } = await sb.from("mood_entries")
      .select("*").neq("sender", CURRENT_USER).order("created_at", { ascending: false }).limit(1);
    if (error || !data || data.length === 0) return;
    const moodEmoji = { sad: "😔", neutral: "😐", happy: "🙂", loved: "😍", tired: "😴" };
    const partnerName = CURRENT_USER === "isreal" ? "Favour" : "Isreal";
    document.getElementById("partnerMood").textContent = `${partnerName} is feeling ${moodEmoji[data[0].mood] || data[0].mood}`;
  }

  document.getElementById("hugBtn").addEventListener("click", async () => {
    const btn = document.getElementById("hugBtn");
    const original = btn.textContent;
    btn.textContent = "sending..."; btn.disabled = true;
    const { error } = await sb.from("hugs").insert({ sender: CURRENT_USER });
    btn.textContent = error ? "❌ try again" : "🤗 hug sent!";
    setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 2000);
  });

  async function loadChat() {
    const { data, error } = await sb.from("messages").select("*").order("created_at", { ascending: true });
    if (error) return;
    const box = document.getElementById("chatBox");
    box.innerHTML = "";
    data.forEach(msg => {
      const b = document.createElement("div");
      b.className = "bubble " + (msg.sender === CURRENT_USER ? "me" : "them");
      if (msg.type === "sketch" && msg.sketch_data) {
        const img = document.createElement("img");
        img.src = msg.sketch_data;
        b.appendChild(img);
      } else {
        b.textContent = msg.text_body || "";
      }
      box.appendChild(b);
    });
    box.scrollTop = box.scrollHeight;
  }

  document.getElementById("sendChatBtn").addEventListener("click", async () => {
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if (!text) return;
    await sb.from("messages").insert({ sender: CURRENT_USER, type: "text", text_body: text });
    input.value = "";
    loadChat();
  });

  const modal = document.getElementById("sketchModal");
  const canvas = document.getElementById("sketchCanvas");
  const ctx = canvas.getContext("2d");
  let drawing = false;
  function startDraw(x, y) { drawing = true; ctx.beginPath(); ctx.moveTo(x, y); }
  function draw(x, y) {
    if (!drawing) return;
    ctx.lineTo(x, y); ctx.strokeStyle = "#2C1E30"; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.stroke();
  }
  function stopDraw() { drawing = false; }
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    if (e.touches) return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  canvas.addEventListener("mousedown", e => { const p = getPos(e); startDraw(p.x, p.y); });
  canvas.addEventListener("mousemove", e => { const p = getPos(e); draw(p.x, p.y); });
  canvas.addEventListener("mouseup", stopDraw);
  canvas.addEventListener("touchstart", e => { e.preventDefault(); const p = getPos(e); startDraw(p.x, p.y); });
  canvas.addEventListener("touchmove", e => { e.preventDefault(); const p = getPos(e); draw(p.x, p.y); });
  canvas.addEventListener("touchend", stopDraw);
  function clearCanvas() { ctx.fillStyle = "#F5EFE6"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  document.getElementById("openSketchBtn").addEventListener("click", () => { clearCanvas(); modal.classList.add("open"); });
  document.getElementById("cancelSketchBtn").addEventListener("click", () => modal.classList.remove("open"));
  document.getElementById("clearSketchBtn").addEventListener("click", clearCanvas);
  document.getElementById("sendSketchBtn").addEventListener("click", async () => {
    const dataUrl = canvas.toDataURL("image/png");
    await sb.from("messages").insert({ sender: CURRENT_USER, type: "sketch", sketch_data: dataUrl });
    modal.classList.remove("open");
    loadChat();
  });

  async function loadWishlist() {
    const { data, error } = await sb.from("wishlist_items").select("*").order("created_at", { ascending: true });
    if (error) return;
    const container = document.getElementById("wishlist");
    container.innerHTML = "";
    data.forEach(item => {
      const row = document.createElement("div");
      row.className = "wish-row";
      row.innerHTML = `<input type="checkbox" ${item.done ? "checked" : ""} data-id="${item.id}" class="wish-check">
        <span style="font-size:13px; ${item.done ? "text-decoration:line-through; color:#8A7690;" : ""}">${item.text}</span>`;
      container.appendChild(row);
    });
    document.querySelectorAll(".wish-check").forEach(cb => {
      cb.addEventListener("change", async (e) => {
        await sb.from("wishlist_items").update({ done: e.target.checked }).eq("id", e.target.dataset.id);
        loadWishlist();
      });
    });
  }
  document.getElementById("addWishBtn").addEventListener("click", async () => {
    const input = document.getElementById("newWishInput");
    const text = input.value.trim();
    if (!text) return;
    await sb.from("wishlist_items").insert({ text: text, added_by: CURRENT_USER });
    input.value = "";
    loadWishlist();
  });

  let lastSeenHugTime = new Date().toISOString();
  async function checkForHugs() {
    const { data, error } = await sb.from("hugs")
      .select("*").neq("sender", CURRENT_USER).gt("created_at", lastSeenHugTime).order("created_at", { ascending: false });
    if (error || !data || data.length === 0) return;
    lastSeenHugTime = new Date().toISOString();
    showHugBanner();
  }
  function showHugBanner() {
    const banner = document.createElement("div");
    banner.textContent = "🤗 you've been hugged!";
    banner.style.cssText = `position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#F2B8C6; color:#3A1F26; padding:14px 22px; border-radius:14px; font-weight:600; z-index:100; box-shadow:0 8px 20px rgba(0,0,0,0.3);`;
    document.body.appendChild(banner);
    setTimeout(() => banner.remove(), 4000);
  }

  // ---- Game tab switching ----
  document.querySelectorAll(".game-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".game-tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".game-panel").forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById("panel-" + tab.dataset.game).classList.add("active");
    });
  });

  // ---- Tic Tac Toe ----
  const WIN_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  async function loadGame() {
    const { data, error } = await sb.from("tictactoe").select("*").limit(1).single();
    if (error || !data) return;
    renderBoard(data);
  }
  function renderBoard(game) {
    const board = JSON.parse(game.board);
    const container = document.getElementById("tttBoard");
    container.innerHTML = "";
    board.forEach((val, i) => {
      const cell = document.createElement("div");
      cell.className = "ttt-cell";
      cell.textContent = val === "isreal" ? "❌" : val === "favour" ? "⭕" : "";
      cell.addEventListener("click", () => makeMove(game, i));
      container.appendChild(cell);
    });
    const statusEl = document.getElementById("tttStatus");
    if (game.winner) {
      statusEl.textContent = game.winner === "draw" ? "it's a draw! 😅" : `${game.winner} wins! 🎉`;
    } else {
      statusEl.textContent = game.turn === CURRENT_USER ? "your turn 👀" : "waiting for partner...";
    }
  }
  async function makeMove(game, index) {
    if (game.winner || game.turn !== CURRENT_USER) return;
    const board = JSON.parse(game.board);
    if (board[index]) return;
    board[index] = CURRENT_USER;
    let winner = null;
    for (const [a,b,c] of WIN_LINES) if (board[a] && board[a] === board[b] && board[b] === board[c]) winner = board[a];
    if (!winner && board.every(v => v)) winner = "draw";
    const nextTurn = CURRENT_USER === "isreal" ? "favour" : "isreal";
    await sb.from("tictactoe").update({ board: JSON.stringify(board), turn: nextTurn, winner }).eq("id", game.id);
    loadGame();
  }
  document.getElementById("tttResetBtn").addEventListener("click", async () => {
    const { data } = await sb.from("tictactoe").select("*").limit(1).single();
    await sb.from("tictactoe").update({ board: '[null,null,null,null,null,null,null,null,null]', turn: "isreal", winner: null }).eq("id", data.id);
    loadGame();
  });

  // ---- Tap Race ----
  async function loadTapRace() {
    const { data, error } = await sb.from("tap_race").select("*").limit(1).single();
    if (error || !data) return;
    document.getElementById("myTaps").textContent = data[CURRENT_USER + "_taps"];
    document.getElementById("partnerTaps").textContent = data[(CURRENT_USER === "isreal" ? "favour" : "isreal") + "_taps"];
    document.getElementById("tapStatus").textContent = data.winner ? `${data.winner} wins the tap race! 🏆` : "tap 20 times first to win!";
  }
  document.getElementById("tapBtn").addEventListener("click", async () => {
    const { data } = await sb.from("tap_race").select("*").limit(1).single();
    if (data.winner) return;
    const field = CURRENT_USER + "_taps";
    const newCount = data[field] + 1;
    const winner = newCount >= 20 ? CURRENT_USER : null;
    await sb.from("tap_race").update({ [field]: newCount, winner }).eq("id", data.id);
    loadTapRace();
  });
  document.getElementById("tapResetBtn").addEventListener("click", async () => {
    const { data } = await sb.from("tap_race").select("*").limit(1).single();
    await sb.from("tap_race").update({ isreal_taps: 0, favour_taps: 0, winner: null }).eq("id", data.id);
    loadTapRace();
  });

  // ---- Quick Draw ----
  let drawTimeout;
  document.getElementById("drawBtn").addEventListener("click", async () => {
    const statusEl = document.getElementById("drawStatus");
    const btn = document.getElementById("drawBtn");
    statusEl.textContent = "wait...";
    btn.disabled = true;
    const delay = 1500 + Math.random() * 3000;
    drawTimeout = setTimeout(() => {
      statusEl.textContent = "GO! TAP NOW!";
      const goTime = Date.now();
      btn.disabled = false;
      btn.onclick = () => {
        const reaction = Date.now() - goTime;
        statusEl.textContent = `your reaction: ${reaction}ms 🎯`;
        btn.disabled = true;
        btn.onclick = null;
        document.getElementById("drawBtn").addEventListener("click", arguments.callee, { once: true });
        setTimeout(() => {
          statusEl.textContent = "tap start to begin";
          btn.disabled = false;
        }, 3000);
      };
    }, delay);
  });

  // ---- This or That ----
  const totQuestions = [
    ["Pizza 🍕", "Burgers 🍔"], ["Movie 🎬", "Game 🎮"], ["Morning ☀️", "Night 🌙"],
    ["Beach 🏖️", "Mountains ⛰️"], ["Rice 🍚", "Swallow 🍲"]
  ];
  let totIndex = 0;
  function renderTot() {
    const [a, b] = totQuestions[totIndex];
    document.getElementById("totQuestion").textContent = "pick one:";
    const row = document.getElementById("totRow");
    row.innerHTML = `<button data-pick="a">${a}</button><button data-pick="b">${b}</button>`;
    document.getElementById("totResult").textContent = "";
    row.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        row.querySelectorAll("button").forEach(b => b.classList.remove("picked"));
        btn.classList.add("picked");
        document.getElementById("totResult").textContent = "pick saved! ask your partner what they chose 😄";
      });
    });
  }
  document.getElementById("totNextBtn").addEventListener("click", () => {
    totIndex = (totIndex + 1) % totQuestions.length;
    renderTot();
  });

  // ---- Mystery Box ----
  async function loadBoxes() {
    const { data, error } = await sb.from("mystery_box").select("*").order("label", { ascending: true });
    if (error || !data) return;
    const grid = document.getElementById("boxGrid");
    grid.innerHTML = "";
    data.forEach(box => {
      const cell = document.createElement("div");
      cell.className = "box-cell" + (box.opened ? " opened" : "");
      cell.textContent = box.opened ? "✅" : "🎁";
      if (!box.opened) {
        cell.addEventListener("click", async () => {
          await sb.from("mystery_box").update({ opened: true, opened_by: CURRENT_USER }).eq("id", box.id);
          document.getElementById("boxResult").textContent = box.content;
          loadBoxes();
        });
      }
      grid.appendChild(cell);
    });
  }

  setUser(CURRENT_USER);
  loadDayCount();
  updateClocks();
  renderTot();
  setInterval(updateClocks, 1000);
  setInterval(loadChat, 4000);
  setInterval(loadPartnerMood, 4000);
  setInterval(checkForHugs, 4000);
  setInterval(loadGame, 3000);
  setInterval(loadTapRace, 2000);
  loadWishlist();
  loadGame();
  loadTapRace();
  loadBoxes();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>

</body>
</html>
